[package]
name = "vaayu_rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "vaayu_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3    = { version = "0.21", features = ["extension-module", "abi3-py38"] }
memmap2 = "0.9"
safetensors = "0.4"
numpy   = "0.21"

[profile.release]
opt-level = 3
lto = "thin"
